<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Займ-ОН | Онлайн займы под 0%</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #161822;
            --accent: #00c853;
            --text: #ffffff;
            --text-muted: #8e94a5;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            border: 1px solid #232738;
            text-align: center;
        }
        .badge {
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 15px;
        }
        .card-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0 0 10px 0;
        }
        .info-row {
            margin: 20px 0;
            font-size: 1.1rem;
        }
        .info-value {
            color: var(--accent);
            font-weight: bold;
        }
        .psk {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 25px;
        }
        .btn-mfo {
            display: block;
            background-color: var(--accent);
            color: #000;
            text-decoration: none;
            font-weight: 700;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }
        .btn-mfo:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">0% НА ПЕРВЫЙ ЗАЙМ</span>
        <div class="card-title">МФО "Займ-ОН"</div>
        
        <div class="info-row">
            <span>Ставка: </span>
            <span class="info-value">0% до 30 дней</span>
        </div>
        
        <div class="psk">ПСК: 292.000% годовых</div>
        
        <a href="#" class="btn-mfo">Получить деньги</a>
    </div>

</body>
</html>
